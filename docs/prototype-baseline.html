<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>龙吟写作</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --paper: #ffffff;
      --chrome: #f0f1ed;
      --sidebar: #f3f4f0;
      --hover: #e9ece6;
      --soft: #eef0eb;
      --text: #242823;
      --secondary: #687067;
      --tertiary: #92998f;
      --line: #e1e4dd;
      --line-strong: #cbd0c7;
      --accent: #386150;
      --accent-hover: #2c5041;
      --accent-soft: #e5ede8;
      --success: #47765a;
      --warning: #b47b32;
      --danger: #a34f46;
      --blue: #547b91;
      --purple: #7b6a91;
      --orange: #a97146;
      --pink: #a56c78;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
    .app { min-width: 1180px; height: 100vh; min-height: 700px; display: grid; grid-template-rows: 52px minmax(0, 1fr); }
    .app-header { display: flex; align-items: center; gap: 22px; padding: 0 18px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 185px; font-size: 16px; font-weight: 700; letter-spacing: .5px; }
    .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 6px; background: var(--accent); color: #fff; font-family: serif; font-size: 16px; }
        .header-path { display: flex; align-items: center; gap: 9px; flex: 1; color: var(--secondary); }
    .header-path strong { color: var(--text); }
        .button { min-height: 30px; padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
    .button:hover { background: var(--hover); border-color: #aeb6aa; }
    .button.primary, .button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .button.primary:hover, .button.active:hover { background: var(--accent-hover); }
    .app-body { display: grid; grid-template-columns: 190px minmax(0, 1fr); height: calc(100vh - 52px); min-height: 648px; }
    .main-nav { display: flex; flex-direction: column; padding: 15px 10px 10px; background: var(--sidebar); border-right: 1px solid var(--line); }
    .current-work { position: relative; width: 100%; padding: 2px 28px 16px 10px; margin-bottom: 11px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
    .current-work:hover strong { color: var(--accent); }
    .current-work b { position: absolute; top: 22px; right: 9px; color: var(--tertiary); font-size: 13px; font-weight: 400; }
    .current-work small { display: block; margin-bottom: 5px; color: var(--tertiary); font-size: 10px; }
    .current-work strong { display: block; margin-bottom: 3px; font-size: 15px; }
    .current-work span { color: var(--secondary); font-size: 11px; }
    .command-trigger { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 5px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--secondary); cursor: pointer; font-size: 11px; text-align: left; }
    .command-trigger:hover { border-color: var(--line-strong); background: var(--hover); }
    .command-trigger kbd { margin-left: auto; color: var(--tertiary); font-family: inherit; font-size: 9px; }
    .command-screen { position: fixed; z-index: 35; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 24px 24px; background: rgba(27,32,28,.28); }
    .command-palette { width: 620px; max-width: 100%; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); overflow: hidden; box-shadow: 0 20px 60px rgba(25,31,26,.16); }
    .command-input-wrap { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line); color: var(--tertiary); }
    .command-input-wrap input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; }
    .command-results { max-height: 430px; overflow: auto; padding: 5px; }
    .command-group { padding: 8px 10px 5px; color: var(--tertiary); font-size: 9px; font-weight: 650; letter-spacing: .7px; }
    .command-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 5px; background: transparent; text-align: left; cursor: pointer; }
    .command-item:hover, .command-item.active { background: var(--soft); }
    .command-kind { display: grid; place-items: center; flex: 0 0 auto; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 4px; color: var(--secondary); font-size: 10px; }
    .command-item strong, .command-item small { display: block; }
    .command-item strong { font-size: 12px; }
    .command-item small { margin-top: 2px; color: var(--tertiary); font-size: 10px; }
    .command-empty { padding: 28px; color: var(--secondary); text-align: center; font-size: 12px; }
    .inspiration-shell { width:100%; max-width:920px; }
    .inspiration-toolbar { display:flex; align-items:center; gap:12px; margin:0 0 8px; }
    .inspiration-toolbar .search-box { width:260px; margin:0; }
    .inspiration-toolbar .scope-tabs { margin:0; }
    .inspiration-count { margin-left:auto; color:var(--tertiary); font-size:10px; }
    .inspiration-list { border-top:1px solid var(--line); }
    .inspiration-note-card { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; padding:16px 4px; border-bottom:1px solid var(--line); }
    .inspiration-note-card[hidden] { display:none; }
    .inspiration-note-card.used { opacity:.56; }
    .inspiration-note-text { color:var(--text); font-size:13px; line-height:1.85; white-space:pre-wrap; word-break:break-word; }
    .inspiration-note-meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:9px; color:var(--tertiary); font-size:10px; }
    .inspiration-note-meta b { color:var(--accent); font-size:10px; font-weight:600; }
    .inspiration-note-actions { display:flex; align-items:flex-start; gap:2px; }
    .inspiration-note-actions button { padding:4px 7px; border:0; border-radius:4px; background:transparent; color:var(--secondary); cursor:pointer; font-size:10px; white-space:nowrap; }
    .inspiration-note-actions button:hover { background:var(--hover); color:var(--text); }
    .inspiration-note-actions button.danger:hover { color:var(--danger); }
    .inspiration-note-actions button.ai-text { color:var(--accent); font-weight:600; }
    .inspiration-beats { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
    .inspiration-beats span { padding:5px 8px; border-left:2px solid var(--accent); background:var(--accent-soft); color:var(--secondary); font-size:11px; line-height:1.6; }
    .inspiration-empty { padding:34px 10px; color:var(--secondary); font-size:12px; text-align:center; }
    .nav-group-label { padding: 10px 9px 4px; color: var(--tertiary); font-size: 9px; font-weight: 600; letter-spacing: .8px; }
    .nav-group-label:first-child { padding-top: 2px; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; margin: 1px 0; padding: 8px 10px; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); text-align: left; cursor: pointer; }
    .nav-item:hover { background: var(--hover); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav-mark { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); font-size: 11px; }
    .nav-item.active .nav-mark { border-color: var(--accent); background: var(--accent); color: #fff; }
    .nav-bottom { margin-top: auto; padding-top: 9px; border-top: 1px solid var(--line); }
    .account-menu-wrap { position: relative; }
    .sidebar-account { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
    .account-popover { position:absolute; left:0; right:0; bottom:calc(100% + 7px); display:none; padding:5px; border:1px solid var(--line-strong); border-radius:6px; background:var(--paper); box-shadow:0 10px 28px rgba(25,31,26,.14); z-index:25; }
    .account-popover.open { display:block; }
    .account-popover button { width:100%; padding:8px 9px; border:0; border-radius:4px; background:transparent; color:var(--danger); text-align:left; cursor:pointer; font-size:12px; }
    .account-popover button:hover { background:var(--hover); }
    .sidebar-account:hover { background: var(--hover); }
    .account-avatar { display: grid; place-items: center; flex: 0 0 auto; width: 31px; height: 31px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
    .account-info { min-width: 0; }
    .account-info strong, .account-info small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-info strong { font-size: 12px; }
    .account-info small { margin-top: 2px; color: var(--tertiary); font-size: 10px; }
    .account-profile { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
    .account-avatar.large { width: 44px; height: 44px; font-size: 17px; }
    .account-profile strong, .account-profile div > span { display: block; }
    .account-profile strong { font-size: 16px; }
    .account-profile div > span { margin-top: 4px; color: var(--secondary); font-size: 11px; }
    .account-list { border-top: 1px solid var(--line); }
    .account-row { display: flex; justify-content: space-between; gap: 20px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .account-row span { color: var(--secondary); }
    .work-switch-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 11px; width: 100%; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
    .work-switch-row:hover, .work-switch-row.selected { background: var(--hover); }
    .work-switch-row .book-spine { width: 30px; height: 38px; }
    .work-switch-row strong, .work-switch-row small { display: block; }
    .work-switch-row small { margin-top: 4px; color: var(--tertiary); font-size: 10px; }
    .work-switch-row b { color: var(--accent); font-size: 10px; font-weight: 600; }
    .danger-button { color: var(--danger); border-color: #d8bab5; }
    .history-dialog { width: 720px; }
    .link-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .link-group { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    .link-group > strong { display: block; margin-bottom: 7px; font-size: 11px; }
    .link-group label { display: flex; align-items: center; gap: 7px; padding: 4px 0; color: var(--secondary); font-size: 12px; cursor: pointer; }
    .link-group input { accent-color: var(--accent); }
    .history-grid { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 300px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .history-list { border-right: 1px solid var(--line); background: var(--bg); }
    .history-item { display: block; width: 100%; padding: 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
    .history-item:hover, .history-item.selected { background: var(--paper); }
    .history-item.selected { box-shadow: inset 2px 0 var(--accent); }
    .history-item strong, .history-item span { display: block; }
    .history-item strong { font-size: 12px; }
    .history-item span { margin-top: 4px; color: var(--tertiary); font-size: 10px; }
    .history-preview { min-width: 0; padding: 17px; overflow: auto; background: var(--paper); }
    .history-preview h2 { margin-bottom: 5px; font-size: 14px; }
    .history-preview > span { color: var(--tertiary); font-size: 10px; }
    .history-preview pre { margin: 14px 0 0; color: var(--secondary); font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; line-height: 1.8; white-space: pre-wrap; }
    .main-content { min-width: 0; min-height: 0; overflow: hidden; }
        .page { height: 100%; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .page.padded { padding: 25px 30px; overflow: auto; }
    .page-title { min-height: 77px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 22px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .padded .page-title { min-height: auto; padding: 0 0 21px; border: 0; background: transparent; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 20px; line-height: 1.4; }
    h2 { font-size: 14px; }
    .page-title p { margin-top: 4px; color: var(--secondary); font-size: 12px; }
    .toolbar { display: flex; gap: 8px; }
    .content-fill { flex: 1; min-height: 0; }
    .inner-sidebar { min-width: 0; padding: 14px 10px; background: var(--sidebar); border-right: 1px solid var(--line); overflow: auto; }
    .panel-label { padding: 2px 7px 8px; color: var(--tertiary); font-size: 10px; font-weight: 600; letter-spacing: .5px; }
    .panel-label.spaced { margin-top: 18px; }
    .muted { color: var(--tertiary); font-weight: 400; }
    .tag { display: inline-flex; align-items: center; min-height: 21px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--soft); color: var(--secondary); font-size: 10px; white-space: nowrap; }
    .tag-button { cursor:pointer; font-family:inherit; }
    .tag-button:hover, .tag-button.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin: 21px 0 10px; }
    .section-heading > span { color: var(--tertiary); font-size: 11px; }
    .field-label { display: block; margin: 20px 0 7px; color: var(--secondary); font-size: 10px; font-weight: 600; }
    .detail-copy { color: var(--secondary); line-height: 1.8; }
    .linked-card { display: block; width: 100%; margin: 4px 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); text-align: left; cursor: pointer; }
    .linked-card:hover { border-color: var(--accent); background: var(--accent-soft); }
    .linked-card strong, .linked-card span { display: block; }
    .linked-card span { margin-top: 5px; color: var(--secondary); font-size: 10px; }
    .search-box { display: flex; align-items: center; gap: 6px; margin-bottom: 15px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--tertiary); }
    .search-box input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); }

    .local-banner { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #d8e1da; border-radius: 7px; background: var(--accent-soft); }
    .local-banner > div:nth-child(2) { flex: 1; }
    .local-banner p { margin-top: 4px; color: var(--secondary); font-size: 12px; }
    .local-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; }
    .work-toolbar { display: flex; align-items: center; gap: 10px; margin: 20px 0 8px; }
    .work-toolbar .search-box { width: 280px; margin: 0; }
    .work-toolbar .dialog-select { width: 135px; height: 32px; padding: 4px 9px; }
    .work-toolbar > span { margin-left: auto; color: var(--tertiary); font-size: 11px; }
    .dashboard-bottom { margin-top:26px; }
    .dashboard-card { max-width:520px; padding:16px 18px; border:1px solid var(--line); border-radius:7px; background:var(--paper); }
    .dashboard-card .section-heading { margin:0 0 12px; }
        .work-list { border-top: 1px solid var(--line); }
    .work-row { display: grid; grid-template-columns: 40px minmax(190px, 1fr) 210px 110px; align-items: center; gap: 15px; width: 100%; padding: 17px 9px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
    .work-row:hover { background: var(--hover); }
    .book-spine { display: grid; place-items: center; width: 35px; height: 45px; border-left: 3px solid var(--accent); border-radius: 3px; background: var(--soft); font-family: serif; font-size: 17px; }
    .work-main strong, .work-main span, .work-time span { display: block; }
    .work-main strong { margin-bottom: 6px; font-size: 15px; }
    .work-main span, .work-progress span { color: var(--secondary); font-size: 11px; }
    .progress { height: 3px; margin-top: 9px; background: var(--line); }
    .progress i { display: block; height: 100%; background: var(--accent); }
    .work-time { color: var(--secondary); font-size: 11px; text-align: right; }
    .work-time span { margin-top: 7px; color: var(--accent); }
        .metric-line { display: flex; align-items: baseline; gap: 7px; }
    .metric-line strong { font-size: 27px; }
    .metric-line .success-text { margin-left: 18px; color: var(--success); }
    
    .page-subtabs { display: flex; align-items: center; gap: 22px; min-height: 43px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .page-subtabs button { align-self: stretch; padding: 0 1px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--secondary); cursor: pointer; font-size: 12px; }
    .page-subtabs button:hover { color: var(--text); }
    .page-subtabs button.active { border-bottom-color: var(--accent); color: var(--text); font-weight: 600; }
    .outline-overview, .volume-stage { flex: 1; min-height: 0; overflow: auto; padding: 28px 34px; background: var(--paper); }
    .outline-overview-inner { max-width: 900px; margin: 0 auto; }
    .outline-kicker { color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .8px; }
    .outline-overview h2 { max-width: 740px; margin: 9px 0 12px; font-size: 24px; line-height: 1.5; }
    .outline-overview .story-premise { max-width: 760px; color: var(--secondary); line-height: 1.9; }
    .outline-hero-input { width: 100%; margin: 10px 0 8px; padding: 4px 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: var(--text); font-size: 24px; font-weight: 650; line-height: 1.5; resize: none; }
    .outline-hero-input:hover, .outline-hero-input:focus { border-bottom-color: var(--line-strong); outline: 0; }
    .story-premise-input { width: 100%; max-width: 760px; min-height: 72px; padding: 6px 0; border: 0; background: transparent; color: var(--secondary); font-size: 13px; line-height: 1.9; resize: vertical; }
    .story-premise-input:focus { outline: 1px solid var(--line-strong); }
    .overview-field textarea { width: 100%; min-height: 72px; padding: 0; border: 0; background: transparent; color: var(--secondary); font: inherit; line-height: 1.75; resize: vertical; }
    .overview-field textarea:focus { outline: 0; }
    .spine-card input, .spine-card textarea { width: 100%; padding: 2px 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: inherit; font: inherit; resize: vertical; }
    .spine-card input:hover, .spine-card textarea:hover, .spine-card input:focus, .spine-card textarea:focus { border-bottom-color: var(--line-strong); outline: 0; }
    .spine-card input { font-weight: 650; }
    .spine-card textarea { margin-top: 4px; color: var(--secondary); font-size: 11px; line-height: 1.65; }
    .spine-card .stage-label { color: var(--tertiary); font-size: 10px; }
    .stage-delete { position: absolute; top: 5px; right: 2px; width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: var(--tertiary); cursor: pointer; }
    .stage-delete:hover { background: var(--hover); color: var(--danger); }
    .meta-input { width: 92px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--text); font-size: 11px; }
    .meta-select { padding: 3px 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--text); font-size: 11px; }
    .beat-edit { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-bottom: 1px solid var(--line); }
    .beat-edit span { display: grid; place-items: center; flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--secondary); font-size: 11px; }
    .beat-edit input { flex: 1; min-width: 0; padding: 7px 4px; border: 0; background: transparent; color: var(--text); }
    .beat-edit input:focus { outline: 1px solid var(--line-strong); }
    .beat-edit button { border: 0; background: transparent; color: var(--tertiary); cursor: pointer; }
    .overview-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
    .overview-field { padding: 14px 15px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    .overview-field span { display: block; margin-bottom: 6px; color: var(--tertiary); font-size: 10px; font-weight: 600; }
    .overview-field p { margin: 0; color: var(--secondary); font-size: 12px; line-height: 1.75; }
    .spine-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 22px; border-top: 1px solid var(--line-strong); }
    .spine-card { position: relative; padding: 18px 18px 18px 0; border-right: 1px solid var(--line); }
    .spine-card:not(:first-child) { padding-left: 18px; }
    .spine-card:last-child { border-right: 0; }
    .spine-card i { position: absolute; top: -4px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .spine-card:not(:first-child) i { left: 18px; }
    .spine-card span { color: var(--tertiary); font-size: 10px; }
    .spine-card strong { display: block; margin: 7px 0 6px; }
    .spine-card p { margin: 0; color: var(--secondary); font-size: 11px; line-height: 1.65; }
    .volume-stage-inner { max-width: 940px; margin: 0 auto; }
    .volume-outline-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .volume-outline-card { padding: 16px 16px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
    .volume-outline-head { display: flex; align-items: flex-start; gap: 12px; }

          if (!record) outlineData.volumes.push(entity);
          state.outlineVolume = entity.id;
        }
        if (kind === "chapter") {
          const entity = record || { id: `${state.currentWork}-chapter-${Date.now()}`, words: "0", beats: [], characterIds: [], placeIds: [], itemIds: [], worldEntryIds: [], materialIds: [], detectedCharacterIds: [], detectedPlaceIds: [], detectedItemIds: [], detectedWorldIds: [], suppressedCharacterIds: [], suppressedPlaceIds: [], suppressedItemIds: [], suppressedWorldIds: [] };
          Object.assign(entity, { title: data.title, volumeId: data.volumeId, state: data.state || record?.state || "待写作", targetWords: Number(data.targetWords) || 4000, summary: data.summary || "" });
          if (!record) {
            const volume = outlineData.volumes.find(item => item.id === data.volumeId) || outlineData.volumes[0];
            entity.volume = volume ? `${volume.title} ${volume.subtitle}`.trim() : "第一卷";
            chapters.push(entity);
            chapterText[entity.id] = "";
            activeData().openTabs.push(entity.id);
          }
          state.chapter = entity.id;
          state.outlineVolume = entity.volumeId;
        }
        if (kind === "shared") {
          const entity = record || { id: `shared-${Date.now()}`, scope: "shared", usage: "当前账户" };
          Object.assign(entity, { kind: data.kind, name: data.name, summary: data.summary || "", base: data.base || "", extension: data.extension || "" });
          if (!record) libraryItems.unshift(entity);
          state.libraryItem = entity.id;
        }
        if (kind === "stage") {
          const entity = record || { id: `stage-${Date.now()}` };
          Object.assign(entity, { label: data.label || "阶段", title: data.title, text: data.text || "" });
          if (!record) outlineData.stages.push(entity);
        }
        state.dialog = null;
        state.entityType = null;
        state.entityId = null;
        state.entityRecord = null;
        state.relationshipSource = null;
        if (kind === "chapter") state.page = "writing";
        if (kind === "volume") state.outlineView = "volumes";
        invalidateRefIndex();
        updateWorkSummary();
        render();
        notify(record ? "修改已保存" : "已创建并保存");
        return;
      }
      if (event.target.id === "ai-settings-form") {
        event.preventDefault();
        const form = event.target;
        state.ai.provider = form.elements.provider.value;
        state.ai.model = form.elements.model.value.trim() || "longyin-mock-1";
        state.ai.apiKey = form.elements.apiKey.value.trim();
        state.ai.baseUrl = form.elements.baseUrl.value.trim();
        state.ai.includeText = form.elements.includeText.checked;
        state.ai.enabled = form.elements.enabled.checked;
        state.ai.configured = true;
        state.dialog = null;
        render();
        notify(state.ai.enabled ? "AI 设置已保存" : "AI 已关闭");
        return;
      }
      if (event.target.id === "inspiration-form") {
        event.preventDefault();
        const form = event.target;
        const text = form.elements.text.value.trim();
        if (!text) { form.querySelector("[data-error-for=text]").textContent = "灵感内容不能为空。"; return; }
        const tags = [...new Set(form.elements.tags.value.split(/[、,，\s]+/).map(tag => tag.trim()).filter(Boolean))];
        const used = form.elements.used.checked;
        const existing = state.inspirationEditId ? inspirations.find(entry => entry.id === state.inspirationEditId) : null;
        if (existing) {
          Object.assign(existing, { text, tags, used });
        } else {
          inspirations.unshift({ id: `insp-${Date.now()}`, text, tags, used, createdAt: "刚刚" });
          activeData().inspirations = inspirations;
        }
        state.dialog = null;
        state.inspirationEditId = null;
        render();
        notify(existing ? "灵感已更新" : "已收进灵感广场");
        return;
      }
      if (event.target.id === "new-work-form") {
        event.preventDefault();
        const form = event.target;
        const name = form.elements.workName.value.trim();
        if (!name) { form.querySelector("[data-work-error]").textContent = "请输入作品名称。"; return; }
        const id = `work-${Date.now()}`;
        works.unshift({ id, name, current: "第一卷 · 第一章 未命名章节", words: "0 字", time: "刚刚", progress: 0, genre: form.elements.genre.value, data: buildBlankWorkData(id) });
        state.dialog = null;
        state.page = "writing";
        state.outlineView = "overview";
        state.character = null;
        state.material = null;
        state.weapon = null;
        state.mapPoint = null;
        state.relationship = null;
        loadWorkData(id);
        render();
        notify(`已创建作品：${name}`);
        return;
      }
      if (event.target.id !== "auth-form") return;
      event.preventDefault();
      const form = event.target;
      const register = form.dataset.kind === "register";
      if (!register) { completeAuth(); return; }
      form.querySelectorAll(".field-error").forEach(error => error.textContent = "");
      form.querySelectorAll(".auth-input").forEach(input => input.classList.remove("invalid"));
      const setError = (name, message) => {
        const error = form.querySelector(`[data-error-for="${name}"]`);
        if (error) error.textContent = message;
        const input = form.elements[name];
        if (input && input.classList) input.classList.add("invalid");
      };
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      let valid = true;
      if (!email) { setError("email", "请输入邮箱。"); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError("email", "请输入有效的邮箱地址。"); valid = false; }
      if (!password) { setError("password", "请输入密码。"); valid = false; }
      else if (register && password.length < 8) { setError("password", "密码至少需要 8 个字符。"); valid = false; }
      if (register && form.elements.confirm.value !== password) { setError("confirm", "两次输入的密码不一致。"); valid = false; }
      if (register && !form.elements.agreement.checked) { setError("agreement", "请先阅读并同意服务条款与隐私政策。"); valid = false; }
      if (valid) completeAuth();
    });
    document.addEventListener("input", event => {
      if (event.target.form && event.target.form.id === "auth-form") {
        const error = event.target.form.querySelector(`[data-error-for="${event.target.name}"]`);
        if (error) error.textContent = "";
        event.target.classList.remove("invalid");
      }
      if (event.target.id === "work-name") event.target.form.querySelector("[data-work-error]").textContent = "";
      if (event.target.id === "work-search") {
        const query = event.target.value.trim().toLowerCase();
        document.querySelectorAll(".work-row").forEach(row => { row.style.display = !query || row.dataset.workSearch.includes(query) ? "" : "none"; });
      }
      if (event.target.id === "character-search") {
        const query = event.target.value.trim().toLowerCase();
        document.querySelectorAll(".person-row").forEach(row => { row.style.display = !query || row.textContent.toLowerCase().includes(query) ? "" : "none"; });
      }
      if (event.target.id === "item-search") {
        const query = event.target.value.trim().toLowerCase();
        document.querySelectorAll(".weapon-row").forEach(row => { row.style.display = !query || row.textContent.toLowerCase().includes(query) ? "" : "none"; });
      }
      if (event.target.id === "command-input") {
        state.commandQuery = event.target.value;
        updateCommandResults();
      }
      if (event.target.id === "material-search") {
        state.materialQuery = event.target.value;
        refreshMaterialList();
      }
      if (event.target.dataset.worldField) { worldOverview[event.target.dataset.worldField] = event.target.value; activeData().worldOverview = worldOverview; }
      if (event.target.dataset.worldSearch) {
        const scope = event.target.dataset.worldSearch;
        const query = event.target.value.trim().toLowerCase();
        const selector = scope === "network" ? ".person-row[data-world-search-text]" : ".world-entity-card[data-world-search-text]";
        let count = 0;
        document.querySelectorAll(selector).forEach(item => {
          const match = !query || item.dataset.worldSearchText.includes(query);
          item.hidden = !match;
          if (match) count += 1;
        });
        const counter = document.querySelector("[data-world-visible]");
        if (counter) counter.textContent = count;
      }
      if (event.target.hasAttribute("data-inspiration-search")) {
        const query = event.target.value.trim().toLowerCase();
        let count = 0;
        document.querySelectorAll(".inspiration-note-card[data-inspiration-search-text]").forEach(item => {
          const match = !query || item.dataset.inspirationSearchText.includes(query);
          item.hidden = !match;
          if (match) count += 1;
        });
        const counter = document.querySelector("[data-inspiration-visible]");
        if (counter) counter.textContent = count;
      }
      if (event.target.hasAttribute("data-ref-search")) {
        state.referenceQuery = event.target.value;
        const query = event.target.value.trim().toLowerCase();
        let count = 0;
        document.querySelectorAll(".ref-row[data-ref-search-text]").forEach(row => {
          const match = !query || row.dataset.refSearchText.includes(query);
          row.hidden = !match;
          if (match) count += 1;
        });
        const empty = document.querySelector("[data-ref-filter-empty]");
        if (empty) empty.hidden = count > 0 || !query;
      }
      if (event.target.dataset.outlineField && outlineData) outlineData[event.target.dataset.outlineField] = event.target.value;
      if (event.target.dataset.stageId) {
        const stage = outlineData.stages.find(item => item.id === event.target.dataset.stageId);
        if (stage) stage[event.target.dataset.stageField] = event.target.value;
      }
      if (event.target.dataset.chapterField && currentChapter()) {
        const chapter = currentChapter();
        chapter[event.target.dataset.chapterField] = event.target.dataset.chapterField === "targetWords" ? Number(event.target.value) : event.target.value;
        if (event.target.dataset.chapterField === "title") updateWorkSummary();
      }
      if (event.target.dataset.beatIndex !== undefined && currentChapter()) currentChapter().beats[Number(event.target.dataset.beatIndex)] = event.target.value;
      if (event.target.id === "manuscript") {
        chapterText[state.chapter] = event.target.value;
        const count = event.target.value.replace(/\s/g, "").length;
        currentChapter().words = count.toLocaleString();
        updateWorkSummary();
        document.getElementById("chapter-word-count").textContent = `本章 ${count.toLocaleString()} 字`;
        const autosave = document.getElementById("autosave-label");
        if (autosave) autosave.textContent = "正在保存…";
        clearTimeout(window.saveTimer);
        window.saveTimer = setTimeout(() => {
          autoAssociateChapter(currentChapter());
          if (autosave) autosave.textContent = "已保存";
        }, 500);
        if (!event.isComposing) updateMentionFromEditor();
      }
    });
    document.addEventListener("compositionend", event => {
      if (event.target.id === "manuscript") updateMentionFromEditor();
    });
    function trackManuscriptSelection(event) {
      if (event.target.id !== "manuscript") return;
      const start = event.target.selectionStart;
      const end = event.target.selectionEnd;
      const next = start !== end ? { start, end, text: event.target.value.slice(start, end) } : null;
      const same = JSON.stringify(next) === JSON.stringify(state.aiSel);
      if (!same) { state.aiSel = next; refreshAISelStrip(); }
    }
    document.addEventListener("keyup", trackManuscriptSelection);
    document.addEventListener("mouseup", trackManuscriptSelection);
    document.addEventListener("change", event => {
      if (event.target.id === "ai-provider") {
        const input = document.getElementById("ai-baseurl");
        const preset = AI_BASEURL_PRESETS[event.target.value] || "";
        const canFill = input && (!input.value.trim() || Object.values(AI_BASEURL_PRESETS).includes(input.value.trim()));
        if (canFill) input.value = preset;
        const status = document.getElementById("ai-test-status");
        if (status) { status.textContent = canFill && preset ? `已按「${event.target.value}」填入默认访问地址，可点测试连接。` : canFill ? "自定义 provider 请手动填写访问地址。" : "保留了你填写的访问地址，可点测试连接验证。"; status.className = "ai-test"; }
        return;
      }
      if (event.target.id === "map-file" && event.target.files[0]) {
        const file = event.target.files[0];
        if (!file.type.startsWith("image/")) { notify("请选择图片文件"); return; }
        if (file.size > 8 * 1024 * 1024) { notify("底图文件不能超过 8MB"); return; }
        const reader = new FileReader();
        reader.onload = () => { activeData().mapImage = reader.result; render(); notify("地图底图已更新"); };
        reader.readAsDataURL(file);
        return;
      }
      if (event.target.id === "backup-file" && event.target.files[0]) {
        restoreAccountBackup(event.target.files[0]);
        event.target.value = "";
      }
      if (event.target.id === "work-sort") { state.workSort = event.target.value; render(); }
      if (event.target.id === "item-image-file" && event.target.files[0]) {
        const file = event.target.files[0];
        if (!file.type.startsWith("image/")) { notify("请选择图片文件"); event.target.value = ""; return; }
        if (file.size > 2 * 1024 * 1024) { notify("装备图片不能超过 2MB"); event.target.value = ""; return; }
        const targetId = state.itemImageTarget;
        const reader = new FileReader();
        reader.onload = () => {
          const item = weapons.find(entry => entry.id === targetId);
          if (!item) return;
          item.image = reader.result;
          state.weapon = item.id;
          state.itemImageTarget = null;
          render();
          notify("装备图片已保存");
        };
        reader.readAsDataURL(file);
        event.target.value = "";
      }
      if (event.target.id === "material-file" && event.target.files[0]) {
        importMaterialFile(event.target.files[0]);
        event.target.value = "";
      }
    });
    document.addEventListener("dragover", event => {
      if (event.target.closest(".materials-layout")) { event.preventDefault(); event.dataTransfer.dropEffect = "copy"; }
    });
    document.addEventListener("drop", event => {
      if (!event.target.closest(".materials-layout") || !event.dataTransfer.files.length) return;
      event.preventDefault();
      Array.from(event.dataTransfer.files).forEach(file => importMaterialFile(file));
    });
    document.addEventListener("contextmenu", event => {
      if (event.target.closest("#world-map-canvas")) event.preventDefault();
    });
    document.addEventListener("pointerdown", event => {
      if (!state.mentionOpen) return;
      const row = event.target.closest("[data-mention-key]");
      if (row) { event.preventDefault(); selectMention(row.dataset.mentionKey); return; }
      if (event.target.closest("#mention-popup")) return;
      closeMention();
    });
    document.addEventListener("pointerdown", event => {
      const canvas = event.target.closest("#world-map-canvas");
      if (!canvas) return;
      const point = mapCanvasPoint(event.clientX, event.clientY);
      if (!point || point.x < 0 || point.y < 0 || point.x > 720 || point.y > 500) return;
      if (state.mapPlaceMode && event.button === 0) {
        state.placementCoords = {
          x: Math.max(24, Math.min(696, point.x)),
          y: Math.max(24, Math.min(476, point.y))
        };
        state.mapPlaceMode = false;
        openEntityDialog("place");
        event.preventDefault();
        return;
      }
      if (event.button === 2 || state.mapTool === "pan") {
        mapDrag = { mode: "pan", startX: event.clientX, startY: event.clientY, panX: state.mapPanX, panY: state.mapPanY };
        canvas.setPointerCapture(event.pointerId);
        event.preventDefault();
        return;
      }
      if (state.mapTool === "brush" && event.button === 0) {
        const cell = terrainAtPoint(point);
        if (!cell) return;
        mapDrag = { mode: "brush", x: cell.x, y: cell.y };
        canvas.setPointerCapture(event.pointerId);
        paintMapCell(cell.x, cell.y);
        drawWorldMapCanvas();
        event.preventDefault();
        return;
      }
      if (state.mapTool === "select" && event.button === 0) {
        const hit = places.find(place => Math.hypot(place.x - point.x, place.y - point.y) < 15 / point.scale);
        if (!hit) return;
        state.mapPoint = hit.name;
        mapDrag = { mode: "pin", place: hit };
        canvas.setPointerCapture(event.pointerId);
        drawWorldMapCanvas();
        event.preventDefault();
      }
    });
    document.addEventListener("pointermove", event => {
      if (!mapDrag) return;
      if (mapDrag.mode === "pan") {
        state.mapPanX = mapDrag.panX + event.clientX - mapDrag.startX;
        state.mapPanY = mapDrag.panY + event.clientY - mapDrag.startY;
        drawWorldMapCanvas();
        return;
      }
      const point = mapCanvasPoint(event.clientX, event.clientY);
      if (!point) return;
      if (mapDrag.mode === "pin") {
        mapDrag.place.x = Math.max(18, Math.min(702, point.x));
        mapDrag.place.y = Math.max(18, Math.min(482, point.y));
        drawWorldMapCanvas();
      }
      if (mapDrag.mode === "brush") {
        const cell = terrainAtPoint(point);
        if (!cell) return;
        paintMapCell(cell.x, cell.y);
        drawWorldMapCanvas();
      }
    });
    document.addEventListener("pointerup", () => {
      if (!mapDrag) return;
      const drag = mapDrag;
      mapDrag = null;
      if (drag.mode === "pin") render();
    });
    document.addEventListener("wheel", event => {
      const canvas = event.target.closest("#world-map-canvas");
      if (!canvas) return;
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const oldScale = Math.min(rect.width / 720, rect.height / 500) * state.mapZoom;
      const offsetX = (rect.width - 720 * (oldScale / state.mapZoom)) / 2 + state.mapPanX;
      const offsetY = (rect.height - 500 * (oldScale / state.mapZoom)) / 2 + state.mapPanY;
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;
      const worldX = (mouseX - offsetX) / oldScale;
      const worldY = (mouseY - offsetY) / oldScale;
      state.mapZoom = Math.max(.5, Math.min(3, state.mapZoom + (event.deltaY < 0 ? .12 : -.12)));
      const newScale = Math.min(rect.width / 720, rect.height / 500) * state.mapZoom;
      state.mapPanX = mouseX - (rect.width - 720 * (newScale / state.mapZoom)) / 2 - worldX * newScale;
      state.mapPanY = mouseY - (rect.height - 500 * (newScale / state.mapZoom)) / 2 - worldY * newScale;
      drawWorldMapCanvas();
    }, { passive: false });
    document.addEventListener("keydown", event => {
      if (state.mentionOpen) {
        if (event.isComposing || event.keyCode === 229) return;
        const candidates = mentionCandidates(state.mentionQuery);
        if (event.key === "ArrowDown") { event.preventDefault(); if (candidates.length) { state.mentionIndex = Math.min(candidates.length - 1, state.mentionIndex + 1); renderMentionPopup(); } return; }
        if (event.key === "ArrowUp") { event.preventDefault(); if (candidates.length) { state.mentionIndex = Math.max(0, state.mentionIndex - 1); renderMentionPopup(); } return; }
        if (event.key === "Enter") {
          if (candidates[state.mentionIndex]) { event.preventDefault(); selectMention(mentionKey(candidates[state.mentionIndex].entity)); }
          else closeMention();
          return;
        }
        if (event.key === "Escape") { event.preventDefault(); closeMention(); return; }
        if (event.key === "Tab" || ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) { closeMention(); return; }
        return;
      }
            if (state.signedIn && event.ctrlKey && event.key.toLowerCase() === "k") { event.preventDefault(); state.commandOpen ? closeCommand() : openCommand(); return; }
      if (state.signedIn && event.ctrlKey && event.key.toLowerCase() === "n") { event.preventDefault(); openCommand("新建"); return; }
      if (state.commandOpen) {
        const items = Array.from(document.querySelectorAll(".command-item"));
        let active = items.findIndex(item => item.classList.contains("active"));
        if (event.key === "ArrowDown") { event.preventDefault(); active = Math.min(items.length - 1, active + 1); items.forEach((item, index) => item.classList.toggle("active", index === active)); if (items[active]) items[active].scrollIntoView({ block: "nearest" }); return; }
        if (event.key === "ArrowUp") { event.preventDefault(); active = Math.max(0, active - 1); items.forEach((item, index) => item.classList.toggle("active", index === active)); if (items[active]) items[active].scrollIntoView({ block: "nearest" }); return; }
        if (event.key === "Enter" && items[active]) { event.preventDefault(); runCommand(items[active].dataset.commandAction); return; }
        if (event.key === "Escape") { event.preventDefault(); closeCommand(); return; }
      }
      if (event.key === "Escape" && state.accountMenuOpen) { state.accountMenuOpen = false; renderAccountMenu(); return; }
      if (event.key === "Escape" && state.dialog) closeDialog();
    });
    document.addEventListener("click", event => {
      if (event.target.classList.contains("command-screen")) closeCommand();
      if (state.accountMenuOpen && !event.target.closest(".account-menu-wrap")) { state.accountMenuOpen = false; renderAccountMenu(); }
    });
    document.addEventListener("scroll", event => {
      if (!state.mentionOpen || !event.target || event.target.id !== "manuscript") return;
      requestAnimationFrame(() => {
        const editor = document.getElementById("manuscript");
        if (!editor || !state.mentionOpen) return;
        const rect = editor.getBoundingClientRect();
        const caret = getTextareaCaretPosition(editor);
        if (caret.bottom < rect.top || caret.top > rect.bottom) closeMention();
        else positionMentionPopup();
      });
    }, true);
    window.addEventListener("resize", () => {
      if (state.mentionOpen) closeMention();
      if (state.page === "maps") drawWorldMapCanvas();
    });
    window.addEventListener("hashchange", () => {
      state.authView = location.hash === "#register" ? "register" : location.hash === "#login" || !state.signedIn ? "login" : null;
      renderAuth();
    });
    loadWorkData();
    render();
  </script>
